name: Quality gates
on:
  pull_request:
  push:
    branches-ignore: [production]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run content:check
      - run: npm run build
      - run: npm test
      - run: npm run graph:check
